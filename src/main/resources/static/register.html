<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Lost & Found</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="navbar">
    <div class="container">
        <strong>LostFound</strong>
        <div>
            <span id="welcomeText">Not logged in</span>
            <span id="navGuest"><a href="/">Home</a><a href="/login.html">Login</a></span>
            <span id="navUser" style="display:none;"><a href="#" onclick="logoutLF()">Logout</a></span>
            <a href="/items.html">Browse</a>
            <a href="/report-police.html">Police Report</a>
        </div>
    </div>
</div>
<div class="container">
    <div class="card" style="max-width:560px;margin:0 auto;">
        <h2>Create Account</h2>
        <p>Use this account for posting and managing your items.</p>
        <form id="registerForm">
            <label>Name <input name="name" required></label>
            <label>Email <input type="email" name="email" required></label>
            <label>Password (min 6 chars) <input type="password" name="password" required></label>
            <label>Phone <input name="phone" required></label>
            <button type="submit">Register</button>
        </form>
        <div class="msg" id="msg"></div>
        <p><a href="/login.html">Already have an account? Login</a></p>
    </div>
</div>

<script>
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = 'Submitting...';

        const payload = Object.fromEntries(new FormData(form).entries());

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (!res.ok) {
                msg.textContent = `Error: ${data.error || 'Registration failed'}`;
                return;
            }

            if (data.userId) {
                localStorage.setItem('lf_userId', data.userId);
                localStorage.setItem('lf_name', data.name || '');
            }
            msg.textContent = `Success: ${data.message}\nYour userId is ${data.userId}\nNow go to login page.`;
            form.reset();
        } catch (err) {
            msg.textContent = 'Error: Could not connect to server';
        }
    });
</script>
<script src="/auth-ui.js"></script>
</body>
</html>
