<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lost & Found</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="navbar">
    <div class="container">
        <strong>LostFound</strong>
        <div>
            <span id="welcomeText">Not logged in</span>
            <span id="navGuest"><a href="/">Home</a><a href="/register.html">Create Account</a></span>
            <span id="navUser" style="display:none;"><a href="#" onclick="logoutLF()">Logout</a></span>
            <a href="/items.html">Browse</a>
            <a href="/report-police.html">Police Report</a>
        </div>
    </div>
</div>
<div class="container">
    <div class="card" style="max-width:560px;margin:0 auto;">
        <h2>Login</h2>
        <form id="loginForm">
            <label>Email <input type="email" name="email" required></label>
            <label>Password <input type="password" name="password" required></label>
            <button type="submit">Login</button>
        </form>
        <div class="msg" id="msg"></div>
        <p><a href="/add-item.html">Add Item</a> | <a href="/items.html">Browse Items</a> | <a href="/my-items.html">My Items</a></p>
    </div>
</div>

<script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = 'Logging in...';

        const payload = Object.fromEntries(new FormData(form).entries());

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (!res.ok) {
                msg.textContent = `Error: ${data.error || 'Login failed'}`;
                return;
            }

            localStorage.setItem('lf_userId', data.userId);
            localStorage.setItem('lf_name', data.name || '');
            msg.textContent = `Success: ${data.message}\nLogged in as ${data.name}\nSaved userId: ${data.userId}`;
            form.reset();
        } catch (err) {
            msg.textContent = 'Error: Could not connect to server';
        }
    });
</script>
<script src="/auth-ui.js"></script>
</body>
</html>
